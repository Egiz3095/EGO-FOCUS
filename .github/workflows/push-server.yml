name: Push server (Cloudflare Worker)

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/push-server.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: push-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Settings → Secrets and variables → Actions"
            exit 1
          fi
          curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | jq -r '.result.status'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install wrangler
        run: npm i -g wrangler@4

      - name: Ensure a workers.dev subdomain
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API" | jq -r '.result.subdomain // empty')
          if [ -z "$SUB" ]; then
            SUB="egofocus-$(echo "$CLOUDFLARE_ACCOUNT_ID" | cut -c1-8)"
            curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              -d "{\"subdomain\":\"$SUB\"}" "$API" | jq -c '{success, errors}'
          fi
          echo "workers.dev subdomain: $SUB"
          echo "SUB=$SUB" >> "$GITHUB_ENV"

      - name: D1 database + schema
        working-directory: server
        run: |
          find_id() { wrangler d1 list --json | jq -r '.[] | select(.name=="egofocus") | .uuid'; }
          ID=$(find_id)
          if [ -z "$ID" ]; then wrangler d1 create egofocus; ID=$(find_id); fi
          echo "D1 id: $ID"
          sed "s/__D1_ID__/$ID/" wrangler.template.toml > wrangler.toml
          wrangler d1 execute egofocus --remote --file schema.sql

      - name: Deploy worker
        working-directory: server
        run: |
          wrangler deploy | tee deploy.log
          URL="https://ego-focus-push.${SUB}.workers.dev"
          echo "URL=$URL" >> "$GITHUB_ENV"

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            if curl -sf "$URL/health"; then echo; curl -sf "$URL/vapid"; echo; exit 0; fi
            echo "waiting for DNS ($i)…"; sleep 15
          done
          echo "::warning::Worker deployed but not reachable yet (new workers.dev subdomains can take a few minutes)."

      - name: Point the web app at the server
        run: |
          printf "/* Set automatically by .github/workflows/push-server.yml after the Cloudflare deploy. */\nwindow.EGO_PUSH_URL = '%s';\n" "$URL" > web/push-config.js
          if ! git diff --quiet web/push-config.js; then
            git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -am "Configure push server URL"
            git push
          fi
